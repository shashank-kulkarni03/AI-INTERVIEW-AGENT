services:

  mysql:
    image: mysql:8.4

    container_name: ai_interview_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_interview
      MYSQL_USER: interview_user
      MYSQL_PASSWORD: interview_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: